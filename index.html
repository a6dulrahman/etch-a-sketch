<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
    <title>Etch-a-Sketch</title>
  </head>
  <body>
    <div><button id="config">Etch-a-Sketch</button></div>
    <div>
      <div id="etch-a-sketch"></div>
    </div>
    <dialog>
      <form action="">
        <label for="num"
          >Squares count for each side: <input type="number" id="num" max="100"
        /></label>
        <p>Hint: maximum number is 16</p>
        <button type="submit">Submit</button>
      </form>
    </dialog>
  </body>
</html>
